# Gera o app do Windows nos servidores do GitHub e publica na aba Releases.
# Como usar: crie uma tag de versão (ex.: v1.0.0) e envie para o GitHub:
#   git tag v1.0.0
#   git push origin v1.0.0
# Também dá para rodar na mão: aba Actions > "Gerar app (Windows)" > Run workflow
# (nesse caso o zip fica como "artifact" da execução, sem criar release).
name: Gerar app (Windows)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Rodar os testes
        run: python -m unittest discover tests

      - name: Gerar o app
        run: python -m eel main.py web --onedir --noconsole --noconfirm --name AlterEgo

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist/AlterEgo -DestinationPath AlterEgo-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AlterEgo-windows
          path: AlterEgo-windows.zip

      - name: Publicar na aba Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AlterEgo-windows.zip
          body: |
            **Como usar (Windows)**
            1. Baixe o `AlterEgo-windows.zip` abaixo e extraia a pasta (não abra de dentro do zip).
            2. Abra o `AlterEgo.exe`.
            3. Na primeira vez, o programa pede a sua chave do Gemini. Crie uma de graça em https://aistudio.google.com/apikey e cole no campo de entrada.

            Precisa do Google Chrome ou do Microsoft Edge instalado.
            Se o Windows mostrar "O Windows protegeu o computador", clique em **Mais informações** e depois em **Executar assim mesmo**. O app não é assinado digitalmente, então esse aviso é esperado.

            **How to use (Windows):** download and extract `AlterEgo-windows.zip`, open `AlterEgo.exe`, and paste your Gemini key when asked (free at https://aistudio.google.com/apikey). If Windows SmartScreen warns you, click **More info** > **Run anyway**.
